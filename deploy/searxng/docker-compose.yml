services:
  searxng:
    image: searxng/searxng:latest
    container_name: mph-searxng
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://127.0.0.1:8088/
      - INSTANCE_NAME=Model Price Hub Search
    restart: unless-stopped
    mem_limit: 768m
