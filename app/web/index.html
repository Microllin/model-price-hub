<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Model Price Hub · 大模型价格</title>
<style>
  /* ======== 色系 ======== */
  :root {
    color-scheme: dark;
    --bg: #0A0E1A; --surface: #101420; --surface-2: #161B2A; --surface-3: #1E2538;
    --line: #1E2740; --line-2: #2A3454;
    --fg: #E8ECF4; --fg-2: #CBD0DC; --muted: #7B84A0; --faint: #4D5672;
    --accent: #818CF8; --accent-dim: #4F46E5; --accent-soft: rgba(129,140,248,.12);
    --cny: #F0B840; --usd: #34D399;
    --hi: #34D399; --mid: #F0B840; --lo: #F06060;
    --radius: 14px; --radius-sm: 10px;
    --shadow: 0 4px 20px rgba(0,0,0,.5);
    --font: "DM Sans", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Space Grotesk", ui-monospace, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F7F8FC; --surface: #FFFFFF; --surface-2: #F1F3F9; --surface-3: #E8EBF4;
    --line: #E2E5EE; --line-2: #CDD2DE;
    --fg: #1A1F36; --fg-2: #3A4060; --muted: #6B7294; --faint: #9DA3BD;
    --accent: #6366F1; --accent-dim: #C7D2FE; --accent-soft: rgba(99,102,241,.10);
    --cny: #B07008; --usd: #0D9E63;
    --hi: #0D9E63; --mid: #B07008; --lo: #DC3545;
    --shadow: 0 4px 24px rgba(99,102,241,.06);
  }

  /* ======== 基础 ======== */
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; color: var(--fg); font: 13px/1.55 var(--font);
    background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }

  /* ======== 头部 ======== */
  header { max-width: 1480px; margin: 0 auto; padding: 20px 32px 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { width: 30px; height: 30px; border-radius: 8px; flex: none; background: linear-gradient(135deg, #818CF8, #4F46E5); display: grid; place-items: center; font: 700 16px var(--font); color: #fff; }
  :root[data-theme="light"] .logo { color: #fff; }
  .htext { flex: 1; min-width: 0; }
  .htext h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid rgba(52,211,153,.28); border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-size: 10.5px; font-weight: 700; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; } .meta b { color: var(--fg-2); font-weight: 600; }
  .hactions { display: flex; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 8px; cursor: pointer; color: var(--fg); background: var(--surface); font-size: 15px; transition: all .15s; text-decoration: none; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); text-decoration: none; }
  .icon-btn svg { pointer-events: none; }

  /* ======== 导航 tab ======== */
  main { max-width: 1480px; margin: 0 auto; padding: 6px 32px 48px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 10px; }
  .seg-btn { padding: 6px 16px; border-radius: 8px; cursor: pointer; color: var(--muted); font: 600 12.5px var(--font); transition: all .15s; white-space: nowrap; border: 0; background: none; }
  .seg-btn:hover { color: var(--fg); }
  .seg-btn.active { color: #fff; background: var(--accent); box-shadow: 0 1px 8px rgba(129,140,248,.25); }
  :root[data-theme="light"] .seg-btn.active { color: #fff; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; max-width: 900px; line-height: 1.6; }
  .pane { display: none; } .pane.on { display: block; }

  /* ======== 自定义下拉 ======== */
  .dd { position: relative; display: inline-block; }
  .dd-hidden { display: none !important; }
  .dd-btn { height: 32px; padding: 0 28px 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); color: var(--fg-2); font: 12px var(--font); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; transition: border-color .15s; text-align: left; }
  .dd-btn::after { content: ""; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); border: 4px solid transparent; border-top: 5px solid var(--faint); }
  .dd-btn:hover { border-color: var(--accent); }
  .dd-btn:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dd-pop { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 100%; max-width: 280px; max-height: 320px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-sm); box-shadow: var(--shadow); overflow: hidden; }
  .dd.open .dd-pop { display: flex; flex-direction: column; }
  .dd-search { margin: 6px; height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface-2); color: var(--fg); font: 12px var(--font); outline: none; }
  .dd-search:focus { border-color: var(--accent); }
  .dd-opts { overflow: auto; flex: 1; }
  .dd-opt { padding: 6px 10px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--fg-2); transition: background .1s; }
  .dd-opt:hover { background: var(--surface-3); }
  .dd-opt.sel { color: var(--accent); font-weight: 600; }
  .dd-opt.sel::before { content: "✓"; font-size: 11px; }
  .dd-opt:not(.sel)::before { content: ""; width: 13px; display: inline-block; }

  /* ======== 搜索框 ======== */
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 300px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search-input { width: 100%; height: 32px; padding: 0 10px 0 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); color: var(--fg); font: 12px var(--font); outline: none; transition: border-color .15s; }
  .search-input::placeholder { color: var(--faint); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .count-pill { color: var(--muted); font-size: 11px; padding: 4px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; margin-left: auto; }

  /* ======== 卡片 ======== */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

  /* ======== 工具栏 ======== */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }

  /* ======== 表格 ======== */
  .wrap { overflow: auto; max-height: calc(100vh - 240px); overscroll-behavior: contain; }
  .wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  .wrap::-webkit-scrollbar-track { background: transparent; }
  .wrap::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; } .wrap::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; font-size: 12px; }
  th, td { height: 36px; text-align: left; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  td { border-top: 1px solid var(--line); }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); }
  th:first-child { z-index: 4; }
  th { color: var(--faint); font-weight: 700; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 2px solid var(--line); }
  th:hover { color: var(--muted); }
  th .sort-arrow { font-size: 9px; margin-left: 3px; color: var(--accent); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  tbody tr { transition: background .08s; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:hover td:first-child { background: color-mix(in srgb, var(--surface) 88%, var(--accent)); }

  /* 官方 tab 列宽 */
  table[data-layout="official"] col:nth-child(1) { width: 25%; }
  table[data-layout="official"] col:nth-child(2) { width: 9%; }
  table[data-layout="official"] col:nth-child(3) { width: 7%; }
  table[data-layout="official"] col:nth-child(4),
  table[data-layout="official"] col:nth-child(5),
  table[data-layout="official"] col:nth-child(6),
  table[data-layout="official"] col:nth-child(7) { width: 10%; }
  table[data-layout="official"] col:nth-child(8) { width: 7%; }
  table[data-layout="official"] col:nth-child(9) { width: 8%; }
  table[data-layout="official"] col:nth-child(10) { width: 9%; }

  /* 聚合行 */
  tr.group-row { cursor: pointer; }
  .caret { display: inline-block; width: 12px; color: var(--faint); font-size: 9px; transition: transform .15s; vertical-align: middle; margin-right: 4px; }
  tr.group-row.open .caret { transform: rotate(90deg); color: var(--accent); }
  .var-count { margin-left: 5px; font-size: 10px; font-weight: 700; color: var(--accent); }
  .main-cond { margin-left: 5px; font-size: 10px; color: var(--faint); font-weight: 400; }
  .variant-row td { background: var(--surface-2); font-size: 11.5px; height: auto; min-height: 28px; padding-top: 4px; padding-bottom: 4px; }
  .variant-row td:first-child { background: var(--surface-2); padding-left: 22px; white-space: normal; line-height: 1.8; }
  .variant-row:hover td, .variant-row:hover td:first-child { background: var(--surface-2); }
  .variant-row .badge { font-size: 9.5px; padding: 1px 6px; }
  .variant-row .model { display: none; }
  .model { display: inline-block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; font-weight: 600; color: var(--fg); }

  /* ======== 徽章 ======== */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.dot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .b-cny { color: var(--cny); background: rgba(240,184,64,.12); }
  .b-usd { color: var(--usd); background: rgba(52,211,153,.12); }
  .b-tag { color: var(--accent); background: var(--accent-soft); }
  .b-std { color: var(--faint); background: transparent; border: 1px solid var(--line-2); }
  .conf-high { color: var(--hi); background: rgba(52,211,153,.12); }
  .conf-medium { color: var(--mid); background: rgba(240,184,64,.12); }
  .conf-low { color: var(--lo); background: rgba(240,96,96,.10); }
  .vtag { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; margin-left: 5px; border-radius: 999px; font-size: 10px; font-weight: 600; color: var(--accent); background: var(--accent-soft); vertical-align: middle; cursor: help; }
  .vtag svg { width: 10px; height: 10px; }

  /* ======== 新闻 ======== */
  .news-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .news-list { display: grid; gap: 1px; background: var(--line); }
  .news-item { padding: 16px 18px; background: var(--surface); transition: background .1s; }
  .news-item:hover { background: var(--surface-2); }
  .news-top { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
  .news-title { margin: 0; font-size: 15px; line-height: 1.45; } .news-title a { color: var(--fg); } .news-title a:hover { color: var(--accent); }
  .news-summary { margin: 8px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.65; max-width: 900px; }
  .news-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--faint); font-size: 11.5px; }
  .news-empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .news-actions { display: flex; gap: 6px; margin-top: 12px; }

  /* ======== 按钮 ======== */
  .btn { height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0 12px; cursor: pointer; font: 600 12px var(--font); white-space: nowrap; border: 1px solid var(--line-2); color: var(--fg-2); background: var(--surface-2); transition: all .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  :root[data-theme="light"] .btn-primary { color: #fff; }
  .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  .btn-danger { color: var(--lo); border-color: var(--lo); background: transparent; }
  .empty { padding: 48px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    header { padding: 14px 14px 8px; } main { padding: 4px 10px 28px; }
    .toolbar { gap: 4px; padding: 6px 8px; } .dd-btn { max-width: 130px; }
    .search-wrap { min-width: 100%; max-width: none; }
    th, td { height: 32px; padding: 4px 6px; font-size: 11px; }
    .wrap { max-height: calc(100vh - 260px); }
  }
</style>
<script>(()=>{const t=localStorage.getItem('mph-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.dataset.theme=t})()</script>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">¥</div>
  <div class="htext">
    <h1>大模型价格中心 <span class="pill">实时监控</span></h1>
    <div class="meta" id="meta">正在加载价格数据…</div>
  </div>
  <div class="hactions">
    <a class="icon-btn" href="/admin" title="后台管理">⚙</a>
    <button class="icon-btn" id="themeToggle" type="button" title="切换主题">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main>
  <nav class="seg">
    <button class="seg-btn active" data-tab="official">官方价格 · 含可信度</button>
    <button class="seg-btn" data-tab="unofficial">第三方渠道</button>
    <button class="seg-btn" data-tab="all">全部价格</button>
    <button class="seg-btn" data-tab="discovery">变更资讯</button>
  </nav>
  <p class="hint" id="tabhint"></p>

  <div class="pane on" id="pricePanel">
    <div class="card">
      <div class="toolbar" id="filterBar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="q" class="search-input" placeholder="搜索模型，如 claude、glm、deepseek" />
        </div>
        <!-- 原生 select 保留（隐藏），由 Dropdown 类生成自定义 UI -->
        <select id="provider" class="dd-hidden"><option value="">所有厂商</option></select>
        <select id="channel" class="dd-hidden"><option value="">所有渠道</option></select>
        <select id="region" class="dd-hidden"><option value="">所有地区</option><option value="cn">中国大陆</option><option value="intl">国际</option></select>
        <select id="currency" class="dd-hidden"><option value="">所有币种</option><option value="CNY">CNY</option><option value="USD">USD</option></select>
        <select id="serviceTier" class="dd-hidden"><option value="">所有服务档位</option><option value="standard">Standard</option><option value="flex">Flex</option><option value="fast">Fast</option><option value="priority">Priority</option><option value="batch">Batch</option><option value="scheduled">峰谷 Scheduled</option></select>
        <select id="modality" class="dd-hidden"><option value="">所有模态</option><option value="text">文本</option><option value="image">图片</option><option value="audio">音频</option><option value="video">视频</option></select>
        <select id="confidence" class="dd-hidden"><option value="">所有可信度</option><option value="high">高可信</option><option value="medium">中可信</option><option value="low">低可信</option></select>
        <select id="convert" class="dd-hidden"><option value="">保持原币种</option><option value="CNY">折算为 CNY</option><option value="USD">折算为 USD</option></select>
        <span class="count-pill" id="count"></span>
      </div>
      <div class="wrap">
        <table id="priceTable" data-layout="official">
          <colgroup id="colgroup"></colgroup>
          <thead id="thead"></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">无匹配数据</div>
      </div>
    </div>
  </div>

  <div class="pane" id="discoveryPanel">
    <div class="card">
      <div class="news-toolbar">
        <select id="newsType" class="dd-hidden"><option value="">所有变更类型</option><option value="model_added">模型上线</option><option value="model_removed">模型下线</option><option value="price_changed">价格调整</option><option value="model_updated">模型更新</option><option value="news">行业资讯</option></select>
        <select id="newsStatus" class="dd-hidden"><option value="">所有状态</option><option value="candidate">待确认</option><option value="verified">已验证</option><option value="rejected">已忽略</option></select>
        <button class="btn btn-primary" id="runDiscovery" type="button">运行发现</button>
        <button class="btn" id="refreshNews" type="button">刷新</button>
        <span class="count-pill" id="newsCount"></span>
      </div>
      <div class="news-list" id="newsList"><div class="news-empty">正在加载变更资讯…</div></div>
    </div>
  </div>
</main>

<script>
/* ======== 自定义下拉组件 ======== */
class Dropdown {
  constructor(sel) {
    this.sel = sel;
    const wrap = document.createElement('div'); wrap.className = 'dd';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    this.btn = document.createElement('button'); this.btn.type = 'button'; this.btn.className = 'dd-btn';
    wrap.insertBefore(this.btn, sel);
    const pop = document.createElement('div'); pop.className = 'dd-pop'; wrap.appendChild(pop);
    this.pop = pop; this.wrap = wrap;
    this.hasSearch = sel.options.length > 7;
    if (this.hasSearch) {
      const si = document.createElement('input'); si.className = 'dd-search'; si.placeholder = '搜索…';
      pop.appendChild(si); this.si = si;
      si.addEventListener('input', () => this._filter(si.value));
    }
    this.listEl = document.createElement('div'); this.listEl.className = 'dd-opts'; pop.appendChild(this.listEl);
    this._build();
    this.btn.addEventListener('click', e => { e.stopPropagation(); this._toggle(); });
    document.addEventListener('click', e => { if (!wrap.contains(e.target)) this._close(); });
    this.btn.addEventListener('keydown', e => { if (e.key === 'Escape') this._close(); });
  }
  _build() {
    const opts = [...this.sel.options];
    this.listEl.innerHTML = opts.map((o, i) =>
      `<div class="dd-opt${o.selected ? ' sel' : ''}" data-i="${i}" data-v="${o.value}">${o.textContent}</div>`
    ).join('');
    this.listEl.querySelectorAll('.dd-opt').forEach(el => el.addEventListener('click', e => {
      e.stopPropagation();
      this.sel.selectedIndex = +el.dataset.i;
      this.sel.dispatchEvent(new Event('change'));
      this._sync(); this._close();
    }));
    this._sync();
  }
  _sync() {
    const o = this.sel.options[this.sel.selectedIndex];
    this.btn.textContent = o ? o.textContent : '';
    this.listEl.querySelectorAll('.dd-opt').forEach(el => el.classList.toggle('sel', el.dataset.i === String(this.sel.selectedIndex)));
  }
  _toggle() {
    const open = this.wrap.classList.toggle('open');
    if (open && this.si) { this.si.value = ''; this._filter(''); this.si.focus(); }
  }
  _close() { this.wrap.classList.remove('open'); }
  _filter(q) {
    q = q.toLowerCase();
    this.listEl.querySelectorAll('.dd-opt').forEach(el => el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none');
  }
  refresh() { this._build(); }
  show(v) { this.wrap.style.display = v ? '' : 'none'; }
}
const DD = {};
document.querySelectorAll('select.dd-hidden').forEach(s => DD[s.id] = new Dropdown(s));

/* ======== 工具函数 ======== */
const $ = id => document.getElementById(id);
const fmt = v => v == null ? '<span class="muted">—</span>' : (+v).toLocaleString('zh-CN', {maximumFractionDigits: 6});
const ctx = v => v == null ? '<span class="muted">—</span>' : (v >= 1000 ? (v/1000).toLocaleString() + 'K' : v);
const curBadge = c => `<span class="badge ${c==='CNY'?'b-cny':'b-usd'} dot">${c}</span>`;
const windowText = r => {
  const tw = r.time_window; if (!tw) return '全天';
  const wins = (tw.windows||[]).map(w=>`${w.start}-${w.end}`).join('、');
  const eff = r.effective_from||tw.effective_from;
  const when = eff ? `｜${new Date(eff).toLocaleString('zh-CN')}` : '';
  const t = `${tw.timezone||''} ${wins||`${tw.start||''}-${tw.end||''}`}${when}`.trim();
  return `<span title="${t}">${t}</span>`;
};
function confBadge(r) {
  const t = `已由 ${r.source_count} 个数据源交叉验证：${(r.sources||[]).join('、')}` + (r.conflict ? '；⚠ 官方数据存在差异' : '');
  const label = {high:'高可信', medium:'中可信', low:'低可信'};
  return `<span class="badge dot conf-${r.confidence}" title="${t}">${label[r.confidence]||'—'}${r.conflict?' ⚠':''}</span>`;
}
const visionTag = r => (r.via_vision || (r.source||'').startsWith('vision-'))
  ? ` <span class="vtag" title="截图视觉识别(Claude 多模态)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><path d="M12 8l1.2 2.8L16 12l-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2z"/></svg>AI</span>` : '';

/* ======== 列定义 ======== */
let ALL = [], TAB = 'official', sortKey = 'provider', sortDir = 1;
const COLS = {
  official: [
    {k:'canonical_model', t:'模型 ID', render:r=>`${r._extra?'<span class="caret">▶</span>':'<span class="caret"> </span>'}<span class="model" title="${r.canonical_model}">${r.canonical_model}</span>${visionTag(r)}${r._extra?`<span class="var-count">+${r._extra}</span>`:''}${r._condHint||''}`},
    {k:'provider', t:'厂商'},
    {k:'currency', t:'货币', render:r=>curBadge(r.currency)},
    {k:'input_per_1m', t:'输入 /1M', num:1, render:r=>fmt(r.input_per_1m)},
    {k:'output_per_1m', t:'输出 /1M', num:1, render:r=>fmt(r.output_per_1m)},
    {k:'cached_input_per_1m', t:'缓存读 /1M', num:1, render:r=>fmt(r.cached_input_per_1m)},
    {k:'cache_write_per_1m', t:'缓存写 /1M', num:1, render:r=>fmt(r.cache_write_per_1m)},
    {k:'context_window', t:'上下文', num:1, render:r=>ctx(r.context_window)},
    {k:'confidence', t:'置信度', render:confBadge},
    {k:'primary_source', t:'数据来源', render:r=>`<span class="muted">${r.primary_source||'—'}</span>${r.source_url?` <a href="${r.source_url}" target="_blank" rel="noopener">↗</a>`:''}`},
  ],
  channels: [
    {k:'provider', t:'厂商'}, {k:'channel', t:'渠道', render:r=>`<span class="muted">${r.channel}</span>`},
    {k:'service_tier', t:'档位'}, {k:'modality', t:'模态'},
    {k:'cache_state', t:'缓存状态', render:r=>r.cache_state||'—'},
    {k:'time_window', t:'时段', render:windowText},
    {k:'model', t:'模型', render:r=>`<span class="model">${r.model}</span>${visionTag(r)}${r.source_url?` <a href="${r.source_url}" target="_blank">↗</a>`:''}`},
    {k:'region', t:'地区'}, {k:'currency', t:'货币', render:r=>curBadge(r.currency)},
    {k:'input_per_1m', t:'输入', num:1, render:r=>fmt(r.input_per_1m)},
    {k:'output_per_1m', t:'输出', num:1, render:r=>fmt(r.output_per_1m)},
    {k:'cached_input_per_1m', t:'缓存读', num:1, render:r=>fmt(r.cached_input_per_1m)},
    {k:'cache_write_per_1m', t:'缓存写', num:1, render:r=>fmt(r.cache_write_per_1m)},
    {k:'source', t:'来源', render:r=>`<span class="muted">${r.source||'—'}</span>`},
  ],
};
const cols = () => TAB === 'official' ? COLS.official : COLS.channels;

/* ======== 表头 ======== */
function renderHead() {
  const cs = cols();
  $('priceTable').dataset.layout = TAB === 'official' ? 'official' : 'channels';
  $('colgroup').innerHTML = cs.map(()=>'<col>').join('');
  $('thead').innerHTML = '<tr>' + cs.map(c => {
    const arrow = sortKey === c.k ? `<span class="sort-arrow">${sortDir > 0 ? '▲' : '▼'}</span>` : '';
    return `<th class="${c.num?'num':''}" data-k="${c.k}">${c.t}${arrow}</th>`;
  }).join('') + '</tr>';
  $('thead').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k; sortDir = (sortKey === k) ? -sortDir : 1; sortKey = k; renderHead(); render();
  }));
}

/* ======== 聚合 + 展开 ======== */
const EXPANDED = new Set();
const isStdRow = r => (r.service_tier||'standard')==='standard' && !r.cache_state && !r.context_range && !r.time_window;
function groupOfficial(rows) {
  const m = new Map();
  for (const r of rows) { const k = `${r.canonical_model}|${r.region}|${r.currency}`; (m.get(k)||m.set(k,[]).get(k)).push(r); }
  return [...m.entries()].map(([k, vs]) => ({ key: k, variants: vs, main: vs.find(isStdRow) || vs[0] }));
}
function condBadges(v) {
  const b = [], tier = v.service_tier||'standard';
  if (tier !== 'standard') b.push(`<span class="badge b-tag">${tier}</span>`);
  if (v.modality && v.modality !== 'text') b.push(`<span class="badge b-tag">${v.modality}</span>`);
  if (v.cache_state) b.push(`<span class="badge b-tag">缓存 ${v.cache_state}</span>`);
  if (v.context_range) b.push(`<span class="badge b-tag">上下文 ${v.context_range}</span>`);
  if (v.time_window) b.push(`<span class="badge b-tag">时段 ${windowText(v)}</span>`);
  if (!b.length) b.push('<span class="badge b-std">standard</span>');
  return b.join(' ');
}
function variantRow(v, cs) {
  return '<tr class="variant-row">' + cs.map((c,i) =>
    i === 0 ? `<td>${condBadges(v)}</td>` : `<td class="${c.num?'num':''}">${c.render?c.render(v):(v[c.k]??'')}</td>`
  ).join('') + '</tr>';
}
function mainCondHint(r) {
  if (isStdRow(r)) return '';
  const p = [], t = r.service_tier||'standard';
  if (t !== 'standard' && !(t === 'scheduled' && r.time_window)) p.push(t);
  if (r.cache_state) p.push(`缓存 ${r.cache_state}`);
  if (r.context_range) p.push(r.context_range);
  if (r.time_window) p.push('分时段');
  return p.length ? `<span class="main-cond" title="主行展示该条件下的价格">${p.join(' · ')}</span>` : '';
}

/* ======== 渲染 ======== */
function render() {
  let rows = ALL.slice();
  const q = $('q').value.trim().toLowerCase();
  if (q) rows = rows.filter(e => (e.canonical_model||e.model||'').toLowerCase().includes(q));
  const cmp = (a,b) => { let x=a[sortKey],y=b[sortKey]; if(x==null)x=-Infinity; if(y==null)y=-Infinity; return typeof x==='string'?x.localeCompare(y)*sortDir:(x-y)*sortDir; };
  const cs = cols();
  if (TAB === 'official') {
    const groups = groupOfficial(rows);
    groups.sort((a,b)=>cmp(a.main,b.main));
    $('count').textContent = `${groups.length} 个模型 · ${rows.length} 条价格条件`;
    $('empty').style.display = groups.length ? 'none' : 'block';
    $('rows').innerHTML = groups.map(g => {
      const open = EXPANDED.has(g.key), others = g.variants.filter(v=>v!==g.main);
      const main = {...g.main, _extra: others.length, _condHint: mainCondHint(g.main)};
      const tds = cs.map(c=>`<td class="${c.num?'num':''}">${c.render?c.render(main):(main[c.k]??'')}</td>`).join('');
      return `<tr class="group-row${open?' open':''}" data-group="${g.key}">${tds}</tr>${open?others.map(v=>variantRow(v,cs)).join(''):''}`;
    }).join('');
    $('rows').querySelectorAll('tr.group-row').forEach(tr => tr.addEventListener('click', ev => {
      if (ev.target.closest('a') || !tr.querySelector('.var-count')) return;
      const k = tr.dataset.group; EXPANDED.has(k)?EXPANDED.delete(k):EXPANDED.add(k); render();
    }));
    return;
  }
  rows.sort(cmp);
  $('count').textContent = `${rows.length} 条`;
  $('empty').style.display = rows.length ? 'none' : 'block';
  $('rows').innerHTML = rows.map(r => '<tr>'+cs.map(c=>`<td class="${c.num?'num':''}">${c.render?c.render(r):(r[c.k]??'')}</td>`).join('')+'</tr>').join('');
}

/* ======== 数据加载 ======== */
async function load() {
  const p = new URLSearchParams();
  for (const k of ['provider','region','currency','serviceTier','modality']) { const v=$(k).value; if(v) p.set(k==='serviceTier'?'service_tier':k,v); }
  let url;
  if (TAB === 'official') { if($('confidence').value) p.set('confidence',$('confidence').value); url='/v1/official-prices?'+p; }
  else { if($('channel').value) p.set('channel',$('channel').value); if(TAB==='unofficial') p.set('official','false'); if($('convert').value) p.set('convert',$('convert').value); url='/v1/prices?'+p; }
  const d = await(await fetch(url)).json();
  ALL = d.entries;
  $('meta').innerHTML = `数据日期：<b>${d.data_date||'—'}</b> · 汇率：1 USD ≈ ${d.fx_usd_to_cny} CNY · 单位：$/1M tokens · <a href="/docs" target="_blank">API 文档</a>`;
  renderHead(); render();
}

async function loadDiscovery() {
  const p = new URLSearchParams();
  if($('newsType').value) p.set('change_type',$('newsType').value);
  if($('newsStatus').value) p.set('status',$('newsStatus').value);
  const d = await(await fetch('/v1/discovery?'+p)).json();
  $('newsCount').textContent = `${d.count} 条`;
  const L={model_added:'模型上线',model_removed:'模型下线',price_changed:'价格调整',model_updated:'模型更新',news:'行业资讯'};
  const S={candidate:'待确认',verified:'已验证',rejected:'已忽略',applied:'已执行'};
  const C={model_added:'conf-high',model_removed:'conf-low',price_changed:'conf-medium',model_updated:'b-tag',news:'b-tag'};
  $('newsList').innerHTML = d.candidates.length ? d.candidates.map(it => {
    const pub = it.published_at ? new Date(it.published_at).toLocaleString('zh-CN') : '—';
    return `<article class="news-item"><div class="news-top"><div><h3 class="news-title"><a href="${it.source_url}" target="_blank">${it.title}</a></h3><div class="news-meta"><span>${it.provider}</span><span>${pub}</span></div></div><span class="badge candidate-status ${C[it.change_type]||'b-tag'}">${S[it.status]||it.status}</span></div><p class="news-summary">${it.summary}</p><div class="news-meta"><span>类型：${L[it.change_type]||it.change_type}</span><span>可信度：${it.confidence}</span>${it.model?`<span>模型：${it.model}</span>`:''}</div>${it.status==='candidate'?`<div class="news-actions"><button class="btn btn-primary" data-nv="${it.id}">确认</button><button class="btn btn-danger" data-nr="${it.id}">忽略</button></div>`:''}</article>`;
  }).join('') : '<div class="news-empty">暂无变更资讯。</div>';
  document.querySelectorAll('[data-nv]').forEach(b=>b.onclick=async()=>{await fetch(`/v1/discovery/${b.dataset.nv}/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});loadDiscovery();});
  document.querySelectorAll('[data-nr]').forEach(b=>b.onclick=async()=>{await fetch(`/v1/discovery/${b.dataset.nr}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});loadDiscovery();});
}

/* ======== Tab 切换 ======== */
function setTab(t) {
  TAB = t;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
  $('pricePanel').classList.toggle('on', t!=='discovery');
  $('discoveryPanel').classList.toggle('on', t==='discovery');
  if (t==='discovery') { $('tabhint').textContent='新闻与官方公告发现层：确认前不修改正式价格或模型状态。'; loadDiscovery(); return; }
  const off = t==='official';
  DD.confidence.show(off); DD.channel.show(!off); DD.convert.show(!off);
  sortKey = 'provider';
  $('tabhint').textContent = off
    ? '官方直营渠道价格；可信度 = 独立数据源交叉验证（高 ≥3、中 2、低 1；⚠ = 官方数据差异）。'
    : t==='unofficial' ? '第三方托管平台渠道价格，不参与官方可信度。' : '官方+第三方全部价格。';
  load();
}

/* ======== 主题 ======== */
function setTheme(t) {
  document.documentElement.dataset.theme = t; localStorage.setItem('mph-theme', t);
  const l = t==='light'; $('themeToggle').title = l?'切换到夜间模式':'切换到日间模式';
}
$('themeToggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
setTheme(document.documentElement.dataset.theme||'dark');

/* ======== 初始化 ======== */
async function initFilters() {
  const d = await(await fetch('/v1/providers')).json();
  const ps=$('provider'), cs=$('channel'), chans=new Set();
  d.providers.forEach(p=>{ps.insertAdjacentHTML('beforeend',`<option value="${p.provider}">${p.provider}</option>`); p.channels.forEach(c=>chans.add(c));});
  [...chans].sort().forEach(c=>cs.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));
  DD.provider.refresh(); DD.channel.refresh();
}
document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
['newsType','newsStatus'].forEach(id => $(id).addEventListener('change', loadDiscovery));
$('refreshNews').addEventListener('click', loadDiscovery);
$('runDiscovery').addEventListener('click', async () => {
  const b=$('runDiscovery'); b.disabled=true; b.textContent='发现中…';
  try { const r=await(await fetch('/v1/discovery/run',{method:'POST'})).json(); alert(`完成：${r.fetched||0} 抓取，${r.new_items||0} 新内容，${r.candidates||0} 候选`); loadDiscovery(); }
  catch(e){ alert('失败：'+e.message); } finally { b.disabled=false; b.textContent='运行发现'; }
});
['provider','channel','region','currency','serviceTier','modality','confidence','convert'].forEach(id => $(id).addEventListener('change', load));
$('q').addEventListener('input', render);
initFilters().then(() => {
  // 支持 ?q= URL 参数（漂移报告的搜索链接）
  const urlQ = new URLSearchParams(location.search).get('q');
  if (urlQ) $('q').value = urlQ;
  setTab('official');
});
</script>
